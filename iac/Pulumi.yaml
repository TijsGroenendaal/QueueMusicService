name: queuemusic
description: Queuemusic Hetzner Cloud Infrastructure
runtime:
  name: nodejs
  options:
    packagemanager: yarn
config:
  pulumi:tags:
    value:
      pulumi:template: typescript
  queuemusic:nodes:
    - name: queuemusic-master
      config:
        type: cax21
        location: hel1
        image: ubuntu-22.04
        publicNet:
          ipv4: true
        controlPlane: true
    - name: queuemusic-worker1
      config:
        type: cax21
        location: hel1
        image: ubuntu-22.04
        publicNet:
          ipv4: true
        controlPlane: false
  queuemusic:argocd-version: 9.4.2
  queuemusic:argocd-values: {}
  queuemusic:certmanager-version: 1.19.3
  queuemusic:certmanager-values: {}
  queuemusic:traefik-version: 39.0.1
  queuemusic:traefik-values: {}
